<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TillThimble – Simple Bookkeeping</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--tx:#17211a;--mut:#5f6f64;--bd:#dfe6dc;--ac:#315b3d;--on:#fff;--up:#1b8a4b;--dn:#d6453d;--am:#e8a33d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#18211b;--tx:#eef3ec;--mut:#9aab9f;--bd:#27342b;--ac:#6fbf86;--on:#0f1511;--up:#4fd184;--dn:#ff7a72}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#18211b;--tx:#eef3ec;--mut:#9aab9f;--bd:#27342b;--ac:#6fbf86;--on:#0f1511;--up:#4fd184;--dn:#ff7a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.top b{font-size:20px;color:var(--ac)}
.lang{width:auto;padding:6px 12px;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.m{text-align:center}.m small{color:var(--mut);display:block;font-size:12px}.m b{font-size:17px}
.big{font-size:32px;font-weight:800}.g{color:var(--up)}.r{color:var(--dn)}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:13px;width:100%}
button{background:var(--ac);color:var(--on);border:0;font-weight:700;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.seg button{background:var(--bg);color:var(--tx);border:2px solid var(--bd)}
.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.seg button.on.e{background:var(--dn);border-color:var(--dn);color:#fff}
.in{margin-top:10px}.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:15px}.chk input{width:22px;height:22px;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}
.row small{color:var(--mut);display:block}.pay{display:flex;gap:6px;margin-top:6px}.pay input{padding:8px}.pay button{width:auto;padding:8px 14px}
.x{width:auto;background:transparent;color:var(--mut);border:1px solid var(--bd);padding:6px 10px;font-size:12px;font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--ac);min-width:3px}.bar.n{background:var(--dn)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:14px}.tabs button.on{color:var(--ac)}
.hide{display:none}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.s{opacity:1}.note{font-size:12px;color:var(--mut);text-align:center;margin:14px 0}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:13px;width:100%}
.bn{border-color:var(--am);font-size:14px}.bn.r{border-color:var(--dn);color:var(--dn);font-weight:600}
</style>
</head>
<body><div class="wrap">
<div class="top"><b>TillThimble</b><button class="lang" id="lg">EN | SW</button></div><div id="bn"></div>

<div id="v-home">
<div class="card"><small style="color:var(--mut)" data-i="today"></small><div class="big" id="pf"></div><small style="color:var(--mut)" data-i="profit"></small>
<div class="grid" style="margin-top:10px"><div class="m"><small data-i="sales"></small><b id="sl" class="g"></b></div><div class="m"><small data-i="exps"></small><b id="ex" class="r"></b></div><div class="m"><small data-i="owed"></small><b id="ow"></b></div></div></div>
<div class="card">
<div class="seg"><button id="bs" class="on" data-i="sale"></button><button id="be" data-i="exp"></button></div>
<input id="am" type="number" inputmode="decimal" min="0" max="10000000" step="any" data-p="amt">
<input id="nt" class="in" maxlength="60" data-p="note">
<label class="chk" id="crw"><input type="checkbox" id="ck"><span data-i="credit"></span></label>
<input id="cu" class="in hide" list="cn" maxlength="40" autocomplete="off" data-p="cust"><datalist id="cn"></datalist>
<button class="in" id="sv" data-i="save"></button></div>
</div>

<div id="v-credit" class="hide"><div class="card" id="cl"></div></div>

<div id="v-hist" class="hide">
<div class="card"><b data-i="week"></b><div id="wk"></div></div>
<div class="card"><b data-i="today"></b><div id="hl"></div></div>
<button class="in" id="cp" data-i="copy"></button><button class="in" id="cs" data-i="csv"></button>
<div class="card"><b data-i="bk"></b><p class="note" style="text-align:left" data-i="bkh"></p><button id="bc" data-i="bkc"></button><textarea id="rt" class="in" rows="3" data-p="rtp"></textarea><button class="in" id="rb" data-i="rst"></button></div></div>
<p class="note">Records are saved on this phone's browser. Clearing browser data erases them.</p>
</div>
<div class="tabs"><button id="t-home" class="on" data-i="home"></button><button id="t-credit" data-i="credits"></button><button id="t-hist" data-i="hist"></button></div>
<div class="toast" id="ts"></div>

<script>
const $=id=>document.getElementById(id);
const T={en:{today:"Today",sale:"Sale",exp:"Expense",profit:"Profit today",sales:"Sales",exps:"Expenses",owed:"Owed to you",amt:"Amount (KSh)",note:"Note (optional)",credit:"Customer will pay later",cust:"Customer name",save:"Save",credits:"Credit",hist:"History",none:"Nothing yet",paid:"Paid",week:"Last 7 days",copy:"Copy report",copied:"Copied ✓",del:"Delete",pay:"Amount paid",home:"Home",saved:"Saved ✓",need:"Enter an amount",needc:"Enter the customer's name",pays:"Payment from",sure:"Sure?",bk:"Backup & restore",bkh:"Copy a backup now and keep it in WhatsApp Saved Messages or Notes. Paste it below to restore.",bkc:"Copy backup",rtp:"Paste a backup here to restore",rst:"Restore from backup",csv:"Copy for spreadsheet",nostore:"This browser can't save your records (private mode or storage full). Copy a backup now and don't close the page.",bad:"Some saved data was damaged and set aside. New records will save normally.",remind:"Tip: copy a backup in the History tab to keep your records safe.",manual:"Select the text and copy it",restored:"Restored",badbk:"That backup isn't valid",oops:"Something went wrong. Please try again."},
sw:{today:"Leo",sale:"Mauzo",exp:"Matumizi",profit:"Faida ya leo",sales:"Mauzo",exps:"Matumizi",owed:"Unadaiwa",amt:"Kiasi (KSh)",note:"Maelezo (hiari)",credit:"Mteja atalipa baadaye",cust:"Jina la mteja",save:"Hifadhi",credits:"Deni",hist:"Historia",none:"Hakuna bado",paid:"Amelipa",week:"Siku 7 zilizopita",copy:"Nakili ripoti",copied:"Imenakiliwa ✓",del:"Futa",pay:"Kiasi alicholipa",home:"Mwanzo",saved:"Imehifadhiwa ✓",need:"Weka kiasi",needc:"Weka jina la mteja",pays:"Malipo kutoka",sure:"Una uhakika?",bk:"Nakala na kurejesha",bkh:"Nakili nakala sasa na uihifadhi kwenye WhatsApp au Notes. Ibandike hapa chini kurejesha.",bkc:"Nakili nakala",rtp:"Bandika nakala hapa kurejesha",rst:"Rejesha kutoka nakala",csv:"Nakili kwa jedwali",nostore:"Kivinjari hiki hakiwezi kuhifadhi rekodi zako (hali ya faragha au nafasi imejaa). Nakili nakala sasa na usifunge ukurasa.",bad:"Baadhi ya data iliharibika na imewekwa kando. Rekodi mpya zitahifadhiwa kawaida.",remind:"Kidokezo: nakili nakala kwenye Historia ili kulinda rekodi zako.",manual:"Chagua maandishi na unakili",restored:"Imerejeshwa",badbk:"Nakala hiyo si sahihi",oops:"Kuna hitilafu. Tafadhali jaribu tena."}};
let S={e:[],lang:"en"},mode="sale";
const ok=e=>e&&typeof e.a==="number"&&isFinite(e.a)&&e.a>0&&e.a<=1e7&&["sale","exp","pay"].includes(e.k)&&typeof e.t==="number";
let warn="",canStore=true,lock=0;
try{const raw=localStorage.getItem("tt");if(raw){try{const s=JSON.parse(raw);if(s&&Array.isArray(s.e)){S.e=s.e.filter(ok);S.lang=s.lang==="sw"?"sw":"en";S.bk=+s.bk||0}else throw 0}catch{try{localStorage.setItem("tt_bad",raw)}catch{}warn="bad"}}}catch{canStore=false}
const canon=s=>{s=s.trim().replace(/\s+/g," ").slice(0,40);const m=S.e.find(e=>e.c&&e.c.toLowerCase()===s.toLowerCase());return m?m.c:s};
const save=()=>{try{localStorage.setItem("tt",JSON.stringify(S));canStore=true;return true}catch{canStore=false;banner();return false}};
const t=k=>T[S.lang][k],K=n=>"KSh "+Math.round(n).toLocaleString();
const dk=ts=>new Date(ts).toLocaleDateString("en-CA"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lang(){document.documentElement.lang=S.lang==="sw"?"sw":"en";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p))}
function toast(m){const e=$("ts");e.textContent=m;e.classList.add("s");setTimeout(()=>e.classList.remove("s"),1400)}
function stats(day){let s=0,x=0;S.e.forEach(e=>{if(dk(e.t)!==day)return;if(e.k==="sale")s+=e.a;if(e.k==="exp")x+=e.a});return{s,x,p:s-x}}
function owed(){const o={};S.e.forEach(e=>{if(!e.c)return;if(e.k==="sale")o[e.c]=(o[e.c]||0)+e.a;if(e.k==="pay")o[e.c]=(o[e.c]||0)-e.a});return Object.entries(o).filter(([,v])=>v>0.5)}
function banner(){let h="";if(!canStore)h=`<div class="card bn r">${t("nostore")}</div>`;else if(warn==="bad")h=`<div class="card bn">${t("bad")}</div>`;else if(S.e.length&&Date.now()-(S.bk||0)>6048e5)h=`<div class="card bn">${t("remind")}</div>`;$("bn").innerHTML=h}
function fillNames(){const s=[...new Set(S.e.filter(e=>e.c).map(e=>e.c))];$("cn").innerHTML=s.map(n=>`<option value="${esc(n)}">`).join("")}
function render(){banner();fillNames();
 const d=stats(dk(Date.now())),ow=owed().reduce((a,[,v])=>a+v,0);
 $("pf").textContent=K(d.p);$("pf").className="big "+(d.p>=0?"g":"r");$("sl").textContent=K(d.s);$("ex").textContent=K(d.x);$("ow").textContent=K(ow);
 const o=owed();
 $("cl").innerHTML=o.length?o.map(([n,v])=>`<div class="row"><div style="flex:1"><b>${esc(n)}</b><small>${K(v)}</small><div class="pay"><input type="number" inputmode="decimal" placeholder="${t("pay")}" data-a="${esc(n)}"><button data-c="${esc(n)}">${t("paid")}</button></div></div></div>`).join(""):`<p style="color:var(--mut)">${t("none")}</p>`;
 const today=S.e.filter(e=>dk(e.t)===dk(Date.now())).reverse();
 $("hl").innerHTML=today.length?today.map(e=>`<div class="row"><div><b class="${e.k==="exp"?"r":"g"}">${e.k==="exp"?"−":"+"} ${K(e.a)}</b><small>${e.k==="pay"?t("pays")+" ":""}${esc(e.c||"")} ${esc(e.n||"")}</small></div><button class="x" data-d="${e.id}">${t("del")}</button></div>`).join(""):`<p style="color:var(--mut)">${t("none")}</p>`;
 const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return{l:x.toLocaleDateString(undefined,{weekday:"short",day:"numeric"}),...stats(dk(x))}}),mx=Math.max(1,...days.map(x=>Math.abs(x.p)));
 $("wk").innerHTML=days.map(x=>`<div class="row"><span style="width:70px;font-size:13px">${x.l}</span><div style="flex:1"><div class="bar ${x.p<0?"n":""}" style="width:${Math.abs(x.p)/mx*100}%"></div></div><b style="font-size:13px">${K(x.p)}</b></div>`).join("");
}
function tab(n){["home","credit","hist"].forEach(k=>{$("v-"+k).classList.toggle("hide",k!==n);$("t-"+k).classList.toggle("on",k===n)})}
["home","credit","hist"].forEach(k=>$("t-"+k).onclick=()=>tab(k));
function setMode(m){mode=m;$("bs").className=m==="sale"?"on":"";$("be").className=m==="exp"?"on e":"";$("crw").classList.toggle("hide",m!=="sale");$("cu").classList.toggle("hide",m!=="sale"||!$("ck").checked)}
$("bs").onclick=()=>setMode("sale");$("be").onclick=()=>setMode("exp");$("ck").onchange=()=>setMode(mode);
$("sv").onclick=()=>{
 if(lock)return;const a=Math.round((+$("am").value)*100)/100,c=$("ck").checked&&mode==="sale"?canon($("cu").value):"";
 if(!(a>0&&a<=1e7))return toast(t("need"));if($("ck").checked&&mode==="sale"&&!c)return toast(t("needc"));
 S.e.push({id:Date.now()+Math.random(),t:Date.now(),k:mode,a,n:$("nt").value.trim().slice(0,60),c});lock=1;setTimeout(()=>lock=0,600);
 save();$("am").value="";$("nt").value="";$("cu").value="";$("ck").checked=false;setMode(mode);render();if(canStore)toast(t("saved"));
};
document.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.d){if(b.dataset.sure){S.e=S.e.filter(e=>String(e.id)!==b.dataset.d);save();render()}else{b.dataset.sure="1";b.textContent=t("sure");setTimeout(()=>{b.dataset.sure="";b.textContent=t("del")},3000)}}
 if(b.dataset.c){const n=b.dataset.c,bal=(owed().find(([x])=>x===n)||[0,0])[1],inp=b.parentNode.querySelector("input"),a=+inp.value||bal;
  if(a>0){S.e.push({id:Date.now()+Math.random(),t:Date.now(),k:"pay",a:Math.min(a,bal),n:"",c:n});save();render();toast(t("saved"))}}
});
$("lg").onclick=()=>{S.lang=S.lang==="en"?"sw":"en";save();lang();render()};
$("cp").onclick=async()=>{
 const d=stats(dk(Date.now())),o=owed();
 const r=`TillThimble ${new Date().toLocaleDateString()}\n${t("sales")}: ${K(d.s)}\n${t("exps")}: ${K(d.x)}\n${t("profit")}: ${K(d.p)}\n${t("owed")}: ${K(o.reduce((a,[,v])=>a+v,0))}`+(o.length?"\n"+o.map(([n,v])=>`- ${n}: ${K(v)}`).join("\n"):"");
 try{await navigator.clipboard.writeText(r);toast(t("copied"))}catch{toast(r)}
};
$("am").addEventListener("keydown",e=>{if(e.key==="Enter")$("sv").click()});
$("bc").onclick=async()=>{const j=JSON.stringify({v:1,e:S.e});S.bk=Date.now();save();try{await navigator.clipboard.writeText(j);toast(t("copied"))}catch{$("rt").value=j;$("rt").select();toast(t("manual"))}banner()};
$("cs").onclick=async()=>{const x="date\ttype\tamount\tcustomer\tnote\n"+S.e.map(e=>[dk(e.t),e.k,e.a,e.c||"",(e.n||"").replace(/[\t\n]/g," ")].join("\t")).join("\n");try{await navigator.clipboard.writeText(x);toast(t("copied"))}catch{$("rt").value=x;$("rt").select();toast(t("manual"))}};
$("rb").onclick=()=>{try{const d=JSON.parse($("rt").value.trim()),inc=(d.e||[]).filter(ok);if(!inc.length)throw 0;const have=new Set(S.e.map(e=>String(e.id)));let n=0;inc.forEach(e=>{if(!have.has(String(e.id))){S.e.push({id:e.id,t:e.t,k:e.k,a:e.a,n:String(e.n||"").slice(0,60),c:String(e.c||"").slice(0,40)});n++}});S.e.sort((a,b)=>a.t-b.t);save();render();$("rt").value="";toast(t("restored")+" "+n)}catch{toast(t("badbk"))}};
let day=dk(Date.now());setInterval(()=>{if(dk(Date.now())!==day){day=dk(Date.now());render()}},6e4);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
addEventListener("error",()=>toast(t("oops")));
lang();setMode("sale");render();
</script></body></html>
